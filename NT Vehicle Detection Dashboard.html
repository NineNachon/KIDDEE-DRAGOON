/* ── Mock Data ──────────────────────────────────────────────────────────── */
function wRand(arr, wts) {
  let r = Math.random(), c = 0;
  for (let i = 0; i < arr.length; i++) { c += wts[i]; if (r <= c) return arr[i]; }
  return arr[arr.length - 1];
}
const p2 = n => String(n).padStart(2, '0');
function mkEntry(mAgo = 0, isNew = false) {
  const d = new Date();
  d.setMinutes(d.getMinutes() - Math.floor(mAgo));
  d.setSeconds(Math.floor(Math.random() * 59));
  return {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6) + mAgo,
    timestamp: `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`,
    car_color: wRand(CLRS, CW),
    brand: wRand(BRANDS, BW),
    vehicle_type: wRand(TYPES, TW),
    isNew,
  };
}

function generateHourlyData() {
  const hours = [];
  const now = new Date();
  for (let i = 23; i >= 0; i--) {
    const h = new Date(now);
    h.setHours(h.getHours() - i);
    hours.push({
      hour: p2(h.getHours()) + ':00',
      count: Math.floor(30 + Math.random() * 60 + (i < 12 ? 20 : 0)),
    });
  }
  return hours;
}

const initData = () => Array.from({ length: 92 }, (_, i) => mkEntry(i * 7));

/* ── Helpers ────────────────────────────────────────────────────────────── */
function useCountUp(target, duration = 800) {
  const [val, setVal] = useState(0);
  const prevRef = useRef(0);
  useEffect(() => {
    const start = prevRef.current;
    const diff = target - start;
    if (diff === 0) { setVal(target); return; }
    const startTime = performance.now();
    const step = (now) => {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setVal(Math.round(start + diff * eased));
      if (progress < 1) requestAnimationFrame(step);
      else prevRef.current = target;
    };
    requestAnimationFrame(step);
  }, [target, duration]);
  return val;
}

/* ── Donut Chart ────────────────────────────────────────────────────────── */
function p2c(cx, cy, r, deg) {
  const rad = ((deg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function donutSeg(cx, cy, R, ri, s0, e0) {
  const gap = Math.min(1.8, (e0 - s0) * 0.06);
  const s = s0 + gap, e = e0 - gap;
  if (e <= s) return '';
  const os = p2c(cx, cy, R, s), oe = p2c(cx, cy, R, e);
  const is_ = p2c(cx, cy, ri, s), ie = p2c(cx, cy, ri, e);
  const lg = (e - s) > 180 ? 1 : 0;
  return `M${os.x.toFixed(2)} ${os.y.toFixed(2)} A${R} ${R} 0 ${lg} 1 ${oe.x.toFixed(2)} ${oe.y.toFixed(2)} L${ie.x.toFixed(2)} ${ie.y.toFixed(2)} A${ri} ${ri} 0 ${lg} 0 ${is_.x.toFixed(2)} ${is_.y.toFixed(2)}Z`;
}

function DonutChart({ entries, dark, lang }) {
  const [hov, setHov] = useState(null);
  const data = useMemo(() => {
    const c = {};
    entries.forEach(e => { c[e.car_color] = (c[e.car_color] || 0) + 1; });
    return Object.entries(c).sort((a, b) => b[1] - a[1]);
  }, [entries]);
  const total = entries.length || 1;
  const cx = 95, cy = 95, R = 78, ri = 50;
  let cur = 0;
  const segs = data.map(([color, cnt]) => {
    const sw = (cnt / total) * 360;
    const seg = { color, cnt, pct: cnt / total, s: cur, e: cur + sw };
    cur += sw;
    return seg;
  });
  const hovSeg = segs.find(s => s.color === hov);
  const textFill = dark ? '#E2E8F0' : '#1a1d23';
  const subFill = dark ? '#64748b' : '#6b7280';

  return (
    <div className="fade-up" style={{
      animationDelay: '150ms',
      background: 'var(--surface)', borderRadius: 'var(--radius)',
      padding: '24px 28px', boxShadow: 'var(--shadow)',
      transition: 'background 0.35s',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 4 }}>
        <span style={{ color: 'var(--purple)' }}>{Icons.palette}</span>
        <div>
          <div style={{ fontWeight: 700, fontSize: 14.5, color: 'var(--text)' }}>
            {lang === 'en' ? 'Vehicle Color Distribution' : 'สัดส่วนสีของรถที่เข้า-ออก'}
          </div>
        </div>
      </div>
      <div style={{ fontSize: 11.5, color: 'var(--subtle)', marginBottom: 18 }}>
        {lang === 'en' ? 'Breakdown by detected car color' : 'แบ่งตามสีรถที่ตรวจจับได้'}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 24 }}>
        <svg width={190} height={190} style={{ flexShrink: 0, overflow: 'visible' }}>
          {segs.map(s => (
            <path key={s.color}
              d={donutSeg(cx, cy, R + (hov === s.color ? 8 : 0), ri, s.s, s.e)}
              fill={CLR_HEX[s.color] || '#ccc'}
              opacity={hov && hov !== s.color ? 0.25 : 1}
              style={{ cursor: 'pointer', transition: 'all 0.25s cubic-bezier(0.22,1,0.36,1)' }}
              onMouseEnter={() => setHov(s.color)}
              onMouseLeave={() => setHov(null)}
            />
          ))}
          {!hov ? (
            <>

/* ── Area Chart (Trend) ─────────────────────────────────────────────────── */
function TrendChart({ entries, dark, lang }) {
  const hourly = useMemo(() => {
    const buckets = {};
    entries.forEach(e => {
      const hr = e.timestamp.slice(11, 13) + ':00';
      buckets[hr] = (buckets[hr] || 0) + 1;
    });
    const sorted = Object.entries(buckets).sort((a, b) => a[0].localeCompare(b[0]));
    if (sorted.length < 2) return generateHourlyData();
    return sorted.map(([hour, count]) => ({ hour, count }));
  }, [entries]);

  const W = 480, H = 200, pad = { t: 10, r: 10, b: 30, l: 40 };
  const iW = W - pad.l - pad.r, iH = H - pad.t - pad.b;
  const maxC = Math.max(...hourly.map(d => d.count), 1);
  const pts = hourly.map((d, i) => ({
    x: pad.l + (i / Math.max(hourly.length - 1, 1)) * iW,
    y: pad.t + iH - (d.count / maxC) * iH,
    ...d,
  }));

  const line = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length - 1].x.toFixed(1)} ${pad.t + iH} L${pts[0].x.toFixed(1)} ${pad.t + iH} Z`;

  const [hov, setHov] = useState(null);
  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(f => pad.t + iH - f * iH);
  const yLabels = [0, 0.25, 0.5, 0.75, 1].map(f => Math.round(f * maxC));
  const textFill = dark ? '#64748b' : '#9ca3af';

  return (
    <div className="fade-up" style={{
      animationDelay: '200ms',
      background: 'var(--surface)', borderRadius: 'var(--radius)',
      padding: '24px 28px', boxShadow: 'var(--shadow)',
      transition: 'background 0.35s',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 4 }}>
        <span style={{ color: 'var(--blue)' }}>{Icons.chart}</span>
        <div style={{ fontWeight: 700, fontSize: 14.5, color: 'var(--text)' }}>
          {lang === 'en' ? 'Hourly Vehicle Trend' : 'แนวโน้มยานพาหนะรายชั่วโมง'}
        </div>
      </div>
      <div style={{ fontSize: 11.5, color: 'var(--subtle)', marginBottom: 16 }}>
        {lang === 'en' ? 'Vehicle detections per hour today' : 'จำนวนยานพาหนะที่ตรวจจับต่อชั่วโมง'}
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', overflow: 'visible' }}>
        <defs>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={dark ? '#3b82f6' : '#3b82f6'} stopOpacity="0.3" />
            <stop offset="100%" stopColor={dark ? '#3b82f6' : '#3b82f6'} stopOpacity="0.02" />
          </linearGradient>
        </defs>
        {gridLines.map((y, i) => (
          <g key={i}>
            <line x1={pad.l} y1={y} x2={W - pad.r} y2={y} stroke={dark ? '#1e293b' : '#f0f0f0'} strokeWidth="1" />
            <text x={pad.l - 8} y={y + 4} textAnchor="end" style={{ fontSize: 9, fill: textFill, fontFamily: 'JetBrains Mono, monospace' }}>
              {yLabels[i]}
            </text>
          </g>
        ))}
        <path d={area} fill="url(#areaGrad)" />
        <path d={line} fill="none" stroke="#3b82f6" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
        {pts.map((p, i) => (
          <circle key={i} cx={p.x} cy={p.y} r={hov === i ? 5 : 3}
            fill={hov === i ? '#3b82f6' : dark ? '#131a2b' : '#ffffff'}
            stroke="#3b82f6" strokeWidth="2"
            style={{ cursor: 'pointer', transition: 'r 0.15s' }}
            onMouseEnter={() => setHov(i)}
            onMouseLeave={() => setHov(null)}
          />
        ))}
        {pts.filter((_, i) => i % Math.max(1, Math.floor(pts.length / 8)) === 0).map(p => (
          <text x={p.x} y={H - 6} textAnchor="middle" style={{ fontSize: 9, fill: textFill, fontFamily: 'JetBrains Mono, monospace' }}>
            {p.hour.slice(0, 2)}
          </text>
        ))}
        {hov != null && pts[hov] && (
          <g>
            <line x1={pts[hov].x} y1={pad.t} x2={pts[hov].x} y2={pad.t + iH}
              stroke={dark ? '#334155' : '#d1d5db'} strokeWidth="1" strokeDasharray="4 3" />
            <rect x={pts[hov].x - 30} y={pts[hov].y - 28} width="60" height="22" rx="6"
              fill={dark ? '#1e293b' : '#1a1d23'} />
            <text x={pts[hov].x} y={pts[hov].y - 13} textAnchor="middle"
              style={{ fontSize: 11, fontWeight: 700, fill: '#fff', fontFamily: 'Sarabun,sans-serif' }}>
              {pts[hov].count}
            </text>
          </g>
        )}
      </svg>
    </div>
  );
}

/* ── Filter Dropdown ─────────────────────────────────────────────────────── */
function FilterDropdown({ label, icon, options, selected, onToggle, onClear, lang }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  const cnt = selected.length;
  return (
    <div style={{ position: 'relative' }} ref={ref}>
      <button onClick={() => setOpen(!open)} style={{
        padding: '8px 14px', borderRadius: 10, border: '1px solid var(--border)',

        fontFamily: 'Sarabun,sans-serif', display: 'flex', alignItems: 'center', gap: 6,

          <span style={{
            background: 'var(--yellow)', color: '#1a1d23', borderRadius: 20,
            padding: '1px 8px', fontSize: 11, fontWeight: 700,
          }}>{cnt}</span>
        )}
        <span style={{ fontSize: 9, marginLeft: 2, opacity: 0.6 }}>▼</span>
      </button>
      {open && (
        <div className="fd-menu">
          <div style={{
            padding: '10px 16px', borderBottom: '1px solid var(--border)',
            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
            position: 'sticky', top: 0, background: 'var(--surface)', zIndex: 1,
          }}>
            <span style={{ fontSize: 11.5, fontWeight: 700, color: 'var(--subtle)' }}>
              {lang === 'en' ? 'Select' : 'เลือก'}

  );
}

/* ── Data Table ─────────────────────────────────────────────────────────── */
const PER_PAGE = 15;

function DataTable({ rows, allRows, search, setSearch, lang,
  typeFilter, setTypeFilter, brandFilter, setBrandFilter,
  colorFilter, setColorFilter, timeStart, setTimeStart, timeEnd, setTimeEnd,
  typeOptions, brandOptions, colorOptions }) {
  const [page, setPage] = useState(1);
  const [sk, setSk] = useState('timestamp');
  const [sd, setSd] = useState('desc');
  const fileRef = useRef();

  const sorted = useMemo(() =>
    [...rows].sort((a, b) => sd === 'asc' ? a[sk].localeCompare(b[sk]) : b[sk].localeCompare(a[sk]))
  , [rows, sk, sd]);

  const pages = Math.max(1, Math.ceil(sorted.length / PER_PAGE));
  const pageRows = sorted.slice((page - 1) * PER_PAGE, page * PER_PAGE);

  useEffect(() => { setPage(1); }, [search, rows.length]);

  const sort = k => { if (sk === k) setSd(d => d === 'asc' ? 'desc' : 'asc'); else { setSk(k); setSd('desc'); } };
  const SI = ({ k }) => sk !== k
    ? <span style={{ color: 'var(--subtle)', marginLeft: 4, fontSize: 10, opacity: 0.5 }}>⇅</span>
    : <span style={{ marginLeft: 4, color: 'var(--yellow-dark)', fontSize: 11 }}>{sd === 'asc' ? '↑' : '↓'}</span>;

  const exportCSV = () => {
    const hdr = 'timestamp,car_color,brand,vehicle_type';
    const body = allRows.map(e => [e.timestamp, e.car_color, e.brand, e.vehicle_type].join(',')).join('\n');
    const blob = new Blob([hdr + '\n' + body], { type: 'text/csv' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'vehicle_log.csv' });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  };
  const importCSV = ev => {
    const f = ev.target.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = e => {
      const imported = e.target.result.split('\n').slice(1).filter(Boolean).map(l => {
        const [timestamp, car_color, brand, vehicle_type] = l.split(',').map(s => s.trim());
        return { id: Math.random().toString(36), timestamp, car_color, brand, vehicle_type, isNew: false };
      }).filter(r => r.timestamp && r.brand);
      window.dispatchEvent(new CustomEvent('nt-csv', { detail: imported }));
    };
    fr.readAsText(f); ev.target.value = '';
  };

  const COL = lang === 'en'
    ? { ts: 'Timestamp', type: 'Vehicle Type', brand: 'Brand', color: 'Color' }
    : { ts: 'เวลา', type: 'ประเภทรถ', brand: 'ยี่ห้อ', color: 'สีรถ' };

  return (
    <div className="fade-up" style={{
      animationDelay: '300ms',
      background: 'var(--surface)', borderRadius: 'var(--radius)',
      boxShadow: 'var(--shadow)', overflow: 'hidden',
      borderTop: '4px solid var(--yellow)',
      transition: 'background 0.35s',
    }}>
      {/* Toolbar */}
      <div style={{
        padding: '20px 28px', display: 'flex', justifyContent: 'space-between',
        alignItems: 'center', borderBottom: '1px solid var(--border)', flexWrap: 'wrap', gap: 14,
      }}>
        <div>
          <div style={{ fontWeight: 700, fontSize: 15.5, color: 'var(--text)' }}>
            {lang === 'en' ? 'Detection Log' : 'บันทึกการตรวจจับยานพาหนะ'}
          </div>
          <div style={{ fontSize: 12, color: 'var(--subtle)', marginTop: 3 }}>
            Live Detection Log · {rows.length.toLocaleString()} {lang === 'en' ? 'entries' : 'รายการ'}
          </div>
        </div>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
          <div style={{ position: 'relative' }}>
            <span style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: 'var(--subtle)', display: 'flex' }}>
              {Icons.search}
            </span>
            <input value={search} onChange={e => setSearch(e.target.value)}
              placeholder={lang === 'en' ? 'Search…' : 'ค้นหา…'}
              style={{
                padding: '9px 14px 9px 36px', border: '1px solid var(--border)',
                borderRadius: 10, fontSize: 13, fontFamily: 'Sarabun,sans-serif',
                background: 'var(--surface2)', color: 'var(--text)', outline: 'none',
                width: 200, transition: 'border 0.2s, box-shadow 0.2s',
              }}
              onFocus={e => { e.target.style.borderColor = 'var(--yellow)'; e.target.style.boxShadow = '0 0 0 3px rgba(255,211,0,0.15)'; }}
              onBlur={e => { e.target.style.borderColor = 'var(--border)'; e.target.style.boxShadow = 'none'; }}
            />
          </div>
          <input ref={fileRef} type="file" accept=".csv" style={{ display: 'none' }} onChange={importCSV} />
          <button onClick={() => fileRef.current?.click()} style={{
            padding: '9px 16px', borderRadius: 10, border: '1px solid var(--border)',
            background: 'var(--surface)', color: 'var(--text)', fontSize: 12.5,
            fontWeight: 600, cursor: 'pointer', fontFamily: 'Sarabun,sans-serif',
            display: 'flex', alignItems: 'center', gap: 6, transition: 'all 0.2s',

            {Icons.upload} {lang === 'en' ? 'Import' : 'นำเข้า'}

            padding: '9px 18px', borderRadius: 10, border: 'none',
            background: 'linear-gradient(135deg, #FFD300, #FFAA00)', color: '#1a1d23',
            fontSize: 12.5, fontWeight: 700, cursor: 'pointer', fontFamily: 'Sarabun,sans-serif',
            display: 'flex', alignItems: 'center', gap: 6, transition: 'all 0.2s',
            boxShadow: '0 2px 8px rgba(255,211,0,0.3)',
          }}>
            {Icons.download} {lang === 'en' ? 'Export CSV' : 'ส่งออก CSV'}
          </button>
        </div>

        {/* Filter Bar */}
        <div style={{
          padding: '14px 28px', display: 'flex', gap: 10, alignItems: 'center',
          borderBottom: '1px solid var(--border)', flexWrap: 'wrap',
          background: 'var(--surface2)',
        }}>
          <FilterDropdown
            label={lang === 'en' ? 'Vehicle Type' : 'ประเภทรถ'}
            options={typeOptions}
            selected={typeFilter}
            onToggle={v => setTypeFilter(prev => prev.includes(v) ? prev.filter(x => x !== v) : [...prev, v])}
            onClear={() => setTypeFilter([])}
            lang={lang}
          />
          <FilterDropdown
            label={lang === 'en' ? 'Brand' : 'ยี่ห้อ'}
            options={brandOptions}
            selected={brandFilter}
            onToggle={v => setBrandFilter(prev => prev.includes(v) ? prev.filter(x => x !== v) : [...prev, v])}
            onClear={() => setBrandFilter([])}
            lang={lang}
          />
          <FilterDropdown
            label={lang === 'en' ? 'Color' : 'สีรถ'}
            options={colorOptions}
            selected={colorFilter}
            onToggle={v => setColorFilter(prev => prev.includes(v) ? prev.filter(x => x !== v) : [...prev, v])}
            onClear={() => setColorFilter([])}
            lang={lang}
          />
          <div style={{ width: 1, height: 28, background: 'var(--border)', margin: '0 2px' }} />
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--subtle)', whiteSpace: 'nowrap' }}>
              {lang === 'en' ? 'From' : 'จาก'}
            </span>
            <input type="datetime-local" value={timeStart} onChange={e => setTimeStart(e.target.value)}
              style={{
                padding: '7px 10px', border: '1px solid var(--border)', borderRadius: 8,
                fontSize: 12, fontFamily: 'JetBrains Mono, monospace', background: 'var(--surface)',
                color: 'var(--text)', outline: 'none', transition: 'border 0.2s',
              }}
              onFocus={e => e.target.style.borderColor = 'var(--yellow)'}
              onBlur={e => e.target.style.borderColor = 'var(--border)'}
            />
            <span style={{ fontSize: 12, color: 'var(--subtle)' }}>—</span>
            <input type="datetime-local" value={timeEnd} onChange={e => setTimeEnd(e.target.value)}
              style={{
                padding: '7px 10px', border: '1px solid var(--border)', borderRadius: 8,
                fontSize: 12, fontFamily: 'JetBrains Mono, monospace', background: 'var(--surface)',
                color: 'var(--text)', outline: 'none', transition: 'border 0.2s',
              }}
              onFocus={e => e.target.style.borderColor = 'var(--yellow)'}
              onBlur={e => e.target.style.borderColor = 'var(--border)'}
            />
          </div>
          {(typeFilter.length > 0 || brandFilter.length > 0 || colorFilter.length > 0 || timeStart || timeEnd) && (
            <button onClick={() => { setTypeFilter([]); setBrandFilter([]); setColorFilter([]); setTimeStart(''); setTimeEnd(''); }} style={{
              padding: '7px 14px', borderRadius: 8, border: '1px solid var(--red)',
              background: 'var(--red-bg)', color: '#dc2626', fontSize: 11.5, fontWeight: 600,
              cursor: 'pointer', fontFamily: 'Sarabun,sans-serif', transition: 'all 0.2s',
              display: 'flex', alignItems: 'center', gap: 5,
            }}>
              ✕ {lang === 'en' ? 'Clear All' : 'ล้างทั้งหมด'}
            </button>
          )}
        </div>
      </div>

      {/* Table */}
      <div style={{ overflowX: 'auto' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
          <thead>
            <tr style={{ background: 'var(--thead)' }}>
              {[['timestamp', 'ts'], ['vehicle_type', 'type'], ['brand', 'brand'], ['car_color', 'color']].map(([k, lk]) => (
                <th key={k} onClick={() => sort(k)} style={{
                  padding: '14px 22px', textAlign: 'left', fontWeight: 700, fontSize: 12,
                  color: 'var(--text)', letterSpacing: 0.3, cursor: 'pointer',
                  userSelect: 'none', whiteSpace: 'nowrap',
                  borderBottom: '2px solid var(--border)', transition: 'color 0.15s',
                }}>
                  {COL[lk]} <SI k={k} />
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {pageRows.map((e, i) => (
              <tr key={e.id} className={`trow${e.isNew ? ' new-row' : ''}`} style={{
                background: i % 2 === 0 ? 'var(--surface)' : 'var(--row-alt)',
                borderBottom: '1px solid var(--border)',
              }}>
                <td style={{ padding: '12px 22px', fontFamily: 'JetBrains Mono, monospace', fontSize: 12, color: 'var(--subtle)' }}>
                  {e.timestamp}
                </td>
                <td style={{ padding: '12px 22px' }}><TypeBadge type={e.vehicle_type} lang={lang} /></td>
                <td style={{ padding: '12px 22px', fontWeight: 600, color: 'var(--text)' }}>{e.brand}</td>
                <td style={{ padding: '12px 22px' }}><ColorDot color={e.car_color} lang={lang} /></td>
              </tr>
            ))}
            {pageRows.length === 0 && (
              <tr><td colSpan={4} style={{
                padding: 48, textAlign: 'center', color: 'var(--subtle)', fontSize: 14,
              }}>
                {lang === 'en' ? 'No results found' : 'ไม่พบข้อมูลที่ค้นหา'}
              </td></tr>
            )}
          </tbody>
        </table>
      </div>

      {/* Pagination */}
      {pages > 1 && (
        <div style={{
          padding: '14px 24px', display: 'flex', justifyContent: 'space-between',
          alignItems: 'center', borderTop: '1px solid var(--border)',
          background: 'var(--row-alt)', flexWrap: 'wrap', gap: 10,
        }}>
          <span style={{ fontSize: 12, color: 'var(--subtle)' }}>
            {lang === 'en' ? 'Showing' : 'แสดง'} {((page - 1) * PER_PAGE) + 1}–{Math.min(page * PER_PAGE, sorted.length)} {lang === 'en' ? 'of' : 'จาก'} {sorted.length}
          </span>
          <div style={{ display: 'flex', gap: 4 }}>
            {[
              ['←', () => setPage(p => Math.max(1, p - 1)), page === 1],
              ...Array.from({ length: Math.min(5, pages) }, (_, i) => {
                const n = Math.max(1, Math.min(page - 2, pages - 4)) + i;
                return n >= 1 && n <= pages ? [n, () => setPage(n), false, page === n] : null;
              }).filter(Boolean),
              ['→', () => setPage(p => Math.min(pages, p + 1)), page === pages],
            ].map((item, i) => {
              if (!item) return null;
              const [label, onClick, disabled, active] = item;
              return (
                <button key={i} onClick={onClick} disabled={disabled} style={{
                  padding: '5px 12px', borderRadius: 8,
                  border: active ? 'none' : '1px solid var(--border)',
                  background: active ? 'linear-gradient(135deg, #FFD300, #FFAA00)' : 'var(--surface)',
                  color: active ? '#1a1d23' : 'var(--text)',
                  fontWeight: active ? 700 : 400,
                  cursor: disabled ? 'not-allowed' : 'pointer',
                  fontSize: 12, opacity: disabled ? 0.35 : 1, transition: 'all 0.15s',
                }}>
                  {label}
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* ── App ────────────────────────────────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": false,
  "lang": "th",
  "liveSpeed": "fast"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [entries, setEntries] = useState(initData);
  const [search, setSearch] = useState('');
  const [typeFilter, setTypeFilter] = useState([]);
  const [brandFilter, setBrandFilter] = useState([]);
  const [colorFilter, setColorFilter] = useState([]);
  const [timeStart, setTimeStart] = useState('');
  const [timeEnd, setTimeEnd] = useState('');

  useEffect(() => {
    document.body.classList.toggle('dark', tweaks.dark);
  }, [tweaks.dark]);

  useEffect(() => {
    const h = e => setEntries(prev => [...e.detail, ...prev]);
    window.addEventListener('nt-csv', h);
    return () => window.removeEventListener('nt-csv', h);
  }, []);

  useEffect(() => {
    const ms = { slow: 14000, normal: 6000, fast: 2000 }[tweaks.liveSpeed] ?? 6000;
    const t = setInterval(() => {
      setEntries(prev => [mkEntry(0, true), ...prev.map(e => ({ ...e, isNew: false }))]);
    }, ms);
    return () => clearInterval(t);
  }, [tweaks.liveSpeed]);

  const filtered = useMemo(() => {
    let result = entries;
    const q = search.trim().toLowerCase();
    if (q) {
      result = result.filter(e =>
        e.brand.toLowerCase().includes(q) ||
        e.car_color.toLowerCase().includes(q) ||
        (TH_CLR[e.car_color] || '').includes(q) ||
        e.vehicle_type.toLowerCase().includes(q) ||
        (TH_TYPE[e.vehicle_type] || '').includes(q) ||
        e.timestamp.includes(q)
      );
    }
    if (typeFilter.length > 0) result = result.filter(e => typeFilter.includes(e.vehicle_type));
    if (brandFilter.length > 0) result = result.filter(e => brandFilter.includes(e.brand));
    if (colorFilter.length > 0) result = result.filter(e => colorFilter.includes(e.car_color));
    if (timeStart) result = result.filter(e => e.timestamp >= timeStart.replace('T', ' '));
    if (timeEnd) result = result.filter(e => e.timestamp <= timeEnd.replace('T', ' ') + ':59');
    return result;
  }, [entries, search, typeFilter, brandFilter, colorFilter, timeStart, timeEnd]);

  const typeOptions = useMemo(() => {
    const types = [...new Set(entries.map(e => e.vehicle_type))].sort();
    return types.map(t => ({ value: t, label: lang === 'en' ? (EN_TYPE[t] || t) : (TH_TYPE[t] || t) }));
  }, [entries, lang]);
  const brandOptions = useMemo(() => {
    return [...new Set(entries.map(e => e.brand))].sort().map(b => ({ value: b, label: b }));
  }, [entries]);
  const colorOptions = useMemo(() => {
    const colors = [...new Set(entries.map(e => e.car_color))];
    return colors.map(c => ({ value: c, label: lang === 'en' ? (EN_CLR[c] || c) : (TH_CLR[c] || c) }));
  }, [entries, lang]);

  const lang = tweaks.lang;
  const dark = tweaks.dark;

  const typeCounts = useMemo(() => {
    const c = {};
    entries.forEach(e => { c[e.vehicle_type] = (c[e.vehicle_type] || 0) + 1; });
    return c;
  }, [entries]);

  return (
    <div style={{ minHeight: '100vh', background: 'var(--bg)' }}>
      <NavBar dark={dark} setDark={v => setTweak('dark', v)} lang={lang} setLang={v => setTweak('lang', v)} />

      <main style={{ padding: '26px 32px', maxWidth: 1480, margin: '0 auto', display: 'flex', flexDirection: 'column', gap: 22 }}>

        {/* KPI Row */}
        <div className="grid-4">
          <StatCard
            icon={Icons.car}
            label={lang === 'en' ? 'Total Vehicles Today' : 'รถยนต์ภายในศูนย์สะสมวันนี้'}
            sublabel={lang === 'en' ? 'All detected vehicles' : 'รวมยานพาหนะที่ตรวจจับ'}
            value={entries.length}
            trend={((entries.length - 1180) / 1180) * 100}
            trendLabel={lang === 'en' ? 'vs yesterday' : 'จากเมื่อวาน'}
            color="#FFD300"
            bgColor="rgba(255,211,0,0.12)"
            delay={0}
          />
          <StatCard
            icon={TYPE_ICON.Car}
            label={lang === 'en' ? 'Personal Cars' : 'รถยนต์ส่วนบุคคล'}
            sublabel={((typeCounts.Car || 0) / (entries.length || 1) * 100).toFixed(1) + '% ' + (lang === 'en' ? 'of total' : 'ของทั้งหมด')}
            value={typeCounts.Car || 0}
            color="#3b82f6"
            bgColor="var(--blue-bg)"
            delay={60}
          />
          <StatCard
            icon={TYPE_ICON.Truck}
            label={lang === 'en' ? 'Trucks' : 'รถบรรทุก'}
            sublabel={((typeCounts.Truck || 0) / (entries.length || 1) * 100).toFixed(1) + '% ' + (lang === 'en' ? 'of total' : 'ของทั้งหมด')}
            value={typeCounts.Truck || 0}
            color="#f59e0b"
            bgColor="var(--red-bg)"
            delay={120}
          />
          <StatCard
            icon={TYPE_ICON.Motorcycle}
            label={lang === 'en' ? 'Motorcycles' : 'รถมอไซต์'}
            sublabel={((typeCounts.Motorcycle || 0) / (entries.length || 1) * 100).toFixed(1) + '% ' + (lang === 'en' ? 'of total' : 'ของทั้งหมด')}
            value={typeCounts.Motorcycle || 0}
            color="#8b5cf6"
            bgColor="var(--purple-bg)"
            delay={180}
          />
        </div>

        {/* Charts Row */}
        <div className="grid-2">
          <DonutChart entries={entries} dark={dark} lang={lang} />
          <TrendChart entries={entries} dark={dark} lang={lang} />
        </div>

        {/* Brands + Types Row */}
        <div className="grid-2">
          <TopBrandsCard entries={entries} lang={lang} />
          <TypeDistribution entries={entries} lang={lang} />
        </div>

        {/* Data Table */}
        <DataTable rows={filtered} allRows={entries} search={search} setSearch={setSearch} lang={lang}
          typeFilter={typeFilter} setTypeFilter={setTypeFilter}
          brandFilter={brandFilter} setBrandFilter={setBrandFilter}
          colorFilter={colorFilter} setColorFilter={setColorFilter}
          timeStart={timeStart} setTimeStart={setTimeStart}
          timeEnd={timeEnd} setTimeEnd={setTimeEnd}
          typeOptions={typeOptions} brandOptions={brandOptions} colorOptions={colorOptions}
        />
      </main>

      <TweaksPanel>
        <TweakSection label="Display">
          <TweakToggle label="Dark Mode"
            value={tweaks.dark}
            onChange={v => setTweak('dark', v)} />
          <TweakRadio label="Language"
            value={tweaks.lang}
            options={['th', 'en']}
            onChange={v => setTweak('lang', v)} />
        </TweakSection>
        <TweakSection label="Live Feed">
          <TweakRadio label="Update Speed"
            value={tweaks.liveSpeed}
            options={['slow', 'normal', 'fast']}
            onChange={v => setTweak('liveSpeed', v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
